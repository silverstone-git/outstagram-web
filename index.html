<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Outstagram: study smarter with AI. Practice exams, an AI tutor that knows the textbook, and a feed to share your progress." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f23" />
    <title>Outstagram</title>
    <script>
      // Apply the saved theme before first paint (no flash). Default: dark.
      try {
        var t = localStorage.getItem('outstagram_theme');
        var dark = t ? t === 'dark' : true;
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#0f0f23' : '#f6f7fb');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
